<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase App (required) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- Firebase Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


</head>

<body onload="home()">
    <nav id="navbar">
        <a href="/registration.html">Registration</a>
        <a href="/login.html">Login</a>
        <a href="/home.html">Home</a>
    </nav>

    <div class="camera-container">
        <div class="camera-with-error"> 
            <video id="quizCamera" autoplay playsinline width="250" height="150"></video>
                <!-- <button id="captureBtn">Capture</button> -->
            <canvas id="snapshot" width="250" height="150"></canvas>

        </div>

        <h1 id="welcome_quize">Welcome to the Quize</h1>

    </div>

    <div class="main">
        <div id="quize">
            <br>
            <div id="question">
            </div>
            <br>
            <div id="options">
                <ol id="quizelist"></ol>
            </div><br>
            <button id="previous">Previous</button>
            <button id="next">Next</button>
            <button id="submit_btn">Submit</button>
        </div>
        <div class="timer-answer-list">
            <div id="timer">
                <canvas id="timerChart" width="120" height="120"></canvas>
                <div id="timerText"
                    style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-weight:bold;">
                </div>
            </div>

            <div class="answer-list">
                <h4>Quiz Questions List</h4>
                <ul id="questionStatus">
                </ul>
            </div>

        </div>
    </div>
    <div id="quize_result" style="display:none">
        <h1>Quize Result</h1>
        <div class="flex-chart">
            <div id="result" style="display:none"></div>
            <div class="chart" style="width:350px; margin:auto; margin-top:20px;">
                <canvas id="quizPieChart"></canvas>
            </div>
        </div>
        <div class="downloadresult">
            <button id="download-result">Download Result</button>
        </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <script type="module" src="./index.js"></script>

</body>

</html>
